name: Daily autopilot

# One post a day at 11:30 AM Central. Two crons cover daylight saving:
# 16:30 UTC = 11:30 CDT, 17:30 UTC = 11:30 CST. run.py works in Central time, posts once per slot,
# and skips the run that lands at the wrong hour.
on:
  schedule:
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, skip the YouTube upload"
        type: boolean
        default: false
      force:
        description: "Run even if paused or the slot is already filled"
        type: boolean
        default: false
      no_log:
        description: "Do not write this run to the run log (test runs, never counts as a recent title)"
        type: boolean
        default: false
      item:
        description: "Optional library item id to preview (manual runs only), e.g. hive-infiltration"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-autopilot
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Load state branch
        run: |
          if git fetch origin autopilot-state 2>/dev/null; then
            git worktree add state origin/autopilot-state
          else
            mkdir state && echo '{"paused": false, "time_central": ["11:30"], "privacy": "public"}' > state/config.json && echo '[]' > state/log.json
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: autopilot/requirements.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r autopilot/requirements.txt
      - name: Make and post the Short
        env:
          STATE_DIR: ${{ github.workspace }}/state
          OUT_DIR: ${{ github.workspace }}/out
          AUTOPILOT_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
          PICK_ITEM: ${{ inputs.item }}
          NO_LOG: ${{ inputs.no_log && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python autopilot/run.py
      - name: Save run log
        if: always()
        run: |
          cd state
          [ -d .git ] || [ -f .git ] || { git init -q -b autopilot-state && git remote add origin "$(cd .. && git remote get-url origin)"; }
          git config user.name "autopilot-bot"; git config user.email "autopilot-bot@users.noreply.github.com"
          git add config.json log.json
          git diff --cached --quiet || git commit -qm "autopilot log $(date -u +%F)"
          git push -q origin HEAD:autopilot-state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short
          path: |
            out/*.mp4
            out/*.json
          retention-days: 7
          if-no-files-found: ignore
